appId: com.cvmux.app
productName: cvmux
copyright: Copyright (c) 2026 iseungsang01 and cvmux contributors. GPL-3.0-or-later.

directories:
  output: release
  buildResources: build

# 자동 업데이트가 볼 곳 (P26-6).
#
# 저장소가 공개라 별도 서버가 필요 없다. 태그를 밀면 CI가 설치 파일과
# latest.yml을 릴리스에 올리고, 앱은 그 파일 하나만 보면 된다.
publish:
  provider: github
  owner: iseungsang01
  repo: cvmux
  # draft는 electron-updater가 보지 못한다 — `releases/latest`에 잡히지 않고
  # 자산도 내려받을 수 없다. 올라가는 순간 공개 상태여야 한다.
  releaseType: release

# node-pty는 N-API(node-addon-api) 모듈이라 ABI가 고정돼 있다. npm이 설치한
# 바이너리가 Electron에서 그대로 동작하는 것을 실측으로 확인했으므로 다시 빌드하지
# 않는다. 켜두면 node-gyp가 Visual Studio를 찾다 실패하고, 빌드하려면 2GB짜리
# 빌드 도구를 깔아야 하는데 얻는 게 없다.
npmRebuild: false

# 무엇을 담을지 손으로 적지 않는다.
#
# main 번들은 npm 패키지 둘을 밖에 남긴다 — 네이티브 모듈인 node-pty와
# electron-updater다. electron-builder는 package.json의 dependencies를 따라가
# 그 둘과 딸린 것들을 알아서 담는다. 한때 "node-pty 하나뿐"이라 적어 두고
# 나머지를 통째로 제외했었는데, 그 뒤 electron-updater가 들어오면서 목록이
# 조용히 낡았고 **설치본이 뜨자마자 죽었다** — `Cannot find module
# 'electron-updater'`. 의존성 목록을 두 곳에 적으면 언젠가 한쪽만 손보게 된다.
files:
  - out/**/*
  - package.json
  # 트레이 아이콘은 런타임에 읽는다 — buildResources는 앱 안에 들어가지 않으므로
  # 이 한 장은 따로 담아야 한다. P18
  - build/icon.png
  # 테스트 번들은 앱이 아니다. `out/**/*`가 통째로 쓸어 담는 바람에 열세 개의
  # 테스트 mjs와 검증 스크립트가 설치본에 실려 나가고 있었다. P26-7
  - '!out/tests/**'
  - '!out/verify-*.mjs'
  # 렌더러 의존성은 vite가 이미 번들에 넣었다. main이 이것들을 require하지
  # 않는다는 것은 out/main/index.js의 require 목록으로 확인된다
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/@xterm/**'
  # react-dom이 끌고 오는 스케줄러. 위 셋을 뺐으므로 이것을 require하는 것도
  # 앱 안에 없다 — main의 require 목록에도 없다
  - '!node_modules/scheduler/**'
  # 소스맵은 사용자 기기에서 아무도 열지 않는다
  - '!**/*.js.map'
  # node-pty는 다섯 플랫폼의 prebuild와 C++ 원본을 함께 배포한다. 우리는
  # win-x64 하나만 포장하고, 런타임이 보는 곳은 prebuilds/win32-x64 뿐이다
  # (lib/utils.js: `prebuilds/${process.platform}-${process.arch}`).
  - '!node_modules/node-pty/prebuilds/darwin-*/**'
  - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  # third_party/conpty는 prebuild 스크립트가 위 폴더로 복사해 오는 원본이다 —
  # 같은 OpenConsole.exe가 두 벌 실려 있었다
  - '!node_modules/node-pty/third_party/**'
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/scripts/**'
  - '!node_modules/node-pty/lib/**/*.test.js'
  # N-API 헤더는 컴파일할 때만 쓴다. npmRebuild가 꺼져 있으므로 여기서는
  # 한 번도 열리지 않는다
  - '!node_modules/node-addon-api/**'

# Electron 런타임에서 우리가 쓰지 않는 것을 덜어낸다 (P26-7).
# files/asarUnpack은 앱 쪽만 손댈 수 있어, Chromium이 들고 오는 파일은
# 포장이 끝난 뒤에 지워야 한다.
afterPack: ./scripts/trim-runtime.mjs

# 브라우저 UI(컨텍스트 메뉴, 파일 대화상자)의 번역 55벌 중 둘만 남긴다.
# 나머지 53벌이 47MB를 차지했다.
electronLanguages:
  - en-US
  - ko

# NSIS의 기본 압축은 normal이다. 포장이 몇 분 길어지는 대신 내려받을 것이
# 눈에 띄게 줄어든다 — 릴리스는 CI가 만들므로 그 시간은 우리 것이 아니다.
compression: maximum

# 네이티브 모듈은 asar 안에서 로드할 수 없다. conpty.dll과 OpenConsole.exe도
# 실제 파일 경로로 존재해야 ConPTY가 뜬다.
asarUnpack:
  - '**/node_modules/node-pty/**'

# CLI는 asar 밖에 있어야 한다. ELECTRON_RUN_AS_NODE로 돌 때는 Electron이 asar를
# 읽지 못하므로, 안에 넣으면 `cvmux ping` 한 줄도 못 돈다. P20-1
extraResources:
  - from: out/cli
    to: cli

# 셸은 cvmux.exe 바로 옆에 놓인다 — 세션 PATH에 이 폴더가 들어간다. P20-1
extraFiles:
  - from: bin/cvmux.cmd
    to: cvmux.cmd

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: cvmux
  deleteAppDataOnUninstall: false
