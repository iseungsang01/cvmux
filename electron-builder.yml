appId: com.cvmux.app
productName: cvmux
copyright: Copyright (c) 2026 iseungsang01 and cvmux contributors. GPL-3.0-or-later.

directories:
  output: release
  buildResources: build

# 자동 업데이트가 볼 곳 (P26-6).
#
# 저장소가 공개라 별도 서버가 필요 없다. 태그를 밀면 CI가 설치 파일과
# latest.yml을 릴리스에 올리고, 앱은 그 파일 하나만 보면 된다.
publish:
  provider: github
  owner: iseungsang01
  repo: cvmux
  # draft는 electron-updater가 보지 못한다 — `releases/latest`에 잡히지 않고
  # 자산도 내려받을 수 없다. 올라가는 순간 공개 상태여야 한다.
  releaseType: release

# node-pty는 N-API(node-addon-api) 모듈이라 ABI가 고정돼 있다. npm이 설치한
# 바이너리가 Electron에서 그대로 동작하는 것을 실측으로 확인했으므로 다시 빌드하지
# 않는다. 켜두면 node-gyp가 Visual Studio를 찾다 실패하고, 빌드하려면 2GB짜리
# 빌드 도구를 깔아야 하는데 얻는 게 없다.
npmRebuild: false

# 무엇을 담을지 손으로 적지 않는다.
#
# main 번들은 npm 패키지 둘을 밖에 남긴다 — 네이티브 모듈인 node-pty와
# electron-updater다. electron-builder는 package.json의 dependencies를 따라가
# 그 둘과 딸린 것들을 알아서 담는다. 한때 "node-pty 하나뿐"이라 적어 두고
# 나머지를 통째로 제외했었는데, 그 뒤 electron-updater가 들어오면서 목록이
# 조용히 낡았고 **설치본이 뜨자마자 죽었다** — `Cannot find module
# 'electron-updater'`. 의존성 목록을 두 곳에 적으면 언젠가 한쪽만 손보게 된다.
files:
  - out/**/*
  - package.json
  # 트레이 아이콘은 런타임에 읽는다 — buildResources는 앱 안에 들어가지 않으므로
  # 이 한 장은 따로 담아야 한다. P18
  - build/icon.png
  # 렌더러 의존성은 vite가 이미 번들에 넣었다. main이 이것들을 require하지
  # 않는다는 것은 out/main/index.js의 require 목록으로 확인된다
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/@xterm/**'

# 네이티브 모듈은 asar 안에서 로드할 수 없다. conpty.dll과 OpenConsole.exe도
# 실제 파일 경로로 존재해야 ConPTY가 뜬다.
asarUnpack:
  - '**/node_modules/node-pty/**'

# CLI는 asar 밖에 있어야 한다. ELECTRON_RUN_AS_NODE로 돌 때는 Electron이 asar를
# 읽지 못하므로, 안에 넣으면 `cvmux ping` 한 줄도 못 돈다. P20-1
extraResources:
  - from: out/cli
    to: cli

# 셸은 cvmux.exe 바로 옆에 놓인다 — 세션 PATH에 이 폴더가 들어간다. P20-1
extraFiles:
  - from: bin/cvmux.cmd
    to: cvmux.cmd

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: cvmux
  deleteAppDataOnUninstall: false
