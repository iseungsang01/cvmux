# 태그를 밀면 설치 파일이 릴리스에 올라간다 (POLICY.md P26-6).
#
# 앱의 자동 업데이트는 릴리스에 함께 올라가는 `latest.yml` 하나를 본다.
# 그래서 배포는 "태그를 민다" 한 줄로 끝나야 하고, 사람이 손으로 파일을
# 올리는 단계가 남아 있으면 안 된다 — 그 단계는 언젠가 잊힌다.
#
#   npm version patch   # package.json을 올리고 v0.1.1 태그를 만든다
#   git push --follow-tags
name: release

on:
  push:
    tags:
      - 'v*'
  # 태그를 밀기 전에 빌드만 확인하고 싶을 때
  workflow_dispatch:

permissions:
  # electron-builder가 릴리스에 자산을 올리려면 이것이 필요하다
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 11부터 install 스크립트가 기본 차단된다. node-pty는 그것이 필요하다
      - run: npm ci --foreground-scripts

      - run: npm run typecheck

      # 회귀 테스트가 깨진 것을 배포하지 않는다
      - run: npm test

      # out/ 은 저장소에 없다 — 여기서 만든다.
      #
      # 이 줄이 없으면 electron-builder가 빈 asar를 싸고
      # `Application entry file "out\main\index.js" ... is corrupted`로 끝난다.
      # 로컬에서는 `npm run package`가 build를 먼저 돌려 주므로 드러나지 않는다.
      - run: npm run build

      # 포장만 하고 아직 올리지 않는다 — 검사가 게시보다 먼저 와야 한다
      - run: npx electron-builder --win --publish never

      # 뜨지 않는 설치본을 내보내지 않는다.
      #
      # 2026-08-05에 `electron-updater`가 빠진 설치본이 릴리스로 나갔다.
      # typecheck도 test도 초록이었다 — 포장한 앱을 아무도 실행해 보지 않았기
      # 때문이다. 이 검사는 main이 밖에 남긴 모듈이 asar 안에 있는지 본다.
      - run: node scripts/verify-package.mjs

      # 릴리스 자리를 먼저 만들고, 자산은 우리가 올린다.
      #
      # electron-builder에게 맡기면 자산마다 "없으면 만든다"가 동시에 돌아 같은
      # 태그로 릴리스가 둘 생기고 파일이 그 사이에 흩어진다 — 실제로 겪었다.
      # `latest.yml`과 설치 파일이 다른 릴리스에 앉으면 자동 업데이트는 파일을
      # 찾지 못한다.
      - name: 검사를 통과한 것만 릴리스에 올린다
        if: github.ref_type == 'tag'
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --generate-notes --verify-tag
          $assets = @(Get-ChildItem release\cvmux-*-setup.exe, release\cvmux-*-setup.exe.blockmap, release\latest.yml).FullName
          if ($assets.Count -lt 3) { throw "올릴 자산이 모자랍니다: $($assets -join ', ')" }
          gh release upload "$env:GITHUB_REF_NAME" $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 태그 없이 돌렸을 때도 결과를 확인할 수 있게 남긴다
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: cvmux-setup
          path: release/*.exe
          if-no-files-found: error
